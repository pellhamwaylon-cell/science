<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian | Middlanders AI Tutor</title>
    <style>
        :root {
            --bg: #0d1117; --panel: #161b22; --panel-light: #21262d; --border: #30363d;
            --accent: #a371f7; --accent-hover: #bc8cff;
            --success: #2ea043; --danger: #da3633; --warn: #d29922; --text: #c9d1d9;
            --font-code: 'Consolas', 'Courier New', monospace;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

        header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { margin: 0; color: var(--accent); font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .back-btn { text-decoration: none; color: var(--text); padding: 8px 16px; background: var(--panel-light); border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-weight: bold; transition: 0.2s; }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        .container { max-width: 800px; margin: 30px auto; padding: 0 20px; width: 100%; flex: 1; display: flex; flex-direction: column; }

        /* Chat Interface */
        .chat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; height: 650px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); overflow: hidden; }
        
        .chat-header { background: #010409; padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 15px; }
        .avatar { width: 40px; height: 40px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; color: #fff; box-shadow: 0 0 10px rgba(163, 113, 247, 0.4); }
        .header-info h2 { margin: 0; font-size: 16px; color: #fff; }
        .header-info p { margin: 0; font-size: 12px; color: var(--success); font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .header-info p::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--success); border-radius: 50%; }

        .chat-history { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: var(--bg); }
        
        /* Message Bubbles */
        .msg-row { display: flex; width: 100%; }
        .msg-row.ai { justify-content: flex-start; }
        .msg-row.user { justify-content: flex-end; }
        
        .bubble { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 14.5px; line-height: 1.5; position: relative; }
        
        .msg-row.ai .bubble { background: var(--panel-light); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
        .msg-row.user .bubble { background: var(--accent); color: #000; border-bottom-right-radius: 4px; font-weight: 500; }

        .bubble strong { color: #fff; }
        .msg-row.user .bubble strong { color: #000; }
        .bubble .formula { display: block; background: #010409; padding: 8px; border-radius: 6px; font-family: var(--font-code); color: var(--accent); margin-top: 8px; font-size: 13px; border: 1px solid var(--border); }

        /* Typing Indicator */
        .typing { display: none; padding: 15px 20px; background: var(--panel-light); border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; border: 1px solid var(--border); }
        .dot { display: inline-block; width: 6px; height: 6px; background: #8b949e; border-radius: 50%; margin: 0 2px; animation: bounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* Input Area */
        .chat-input-area { padding: 15px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 12px 15px; background: #010409; border: 1px solid var(--border); color: #fff; border-radius: 20px; outline: none; font-size: 14px; transition: 0.2s; }
        .chat-input-area input:focus { border-color: var(--accent); }
        .send-btn { background: var(--accent); color: #000; border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 16px; }
        .send-btn:hover { filter: brightness(1.2); transform: scale(1.05); }

    </style>
</head>
<body>

    <header>
        <h1>🤖 Julian | Study Tutor</h1>
        <a href="index.html" class="back-btn">← Back to Hub</a>
    </header>

    <div class="container">
        
        <div class="chat-card">
            
            <div class="chat-header">
                <div class="avatar">J</div>
                <div class="header-info">
                    <h2>Julian (Middlanders AI)</h2>
                    <p>Online and ready to help</p>
                </div>
            </div>

            <div class="chat-history" id="chat-history">
                <!-- Welcome Message -->
                <div class="msg-row ai">
                    <div class="bubble">
                        Hey Waylon! I'm Julian, your Middlanders local AI tutor. I have the entire 7th and 8th-grade science curriculum loaded in my memory.<br><br>Ask me a question about variables, physics, cells, or genetics!
                    </div>
                </div>
                
                <!-- Typing Indicator (Hidden by default) -->
                <div class="msg-row ai" id="typing-indicator">
                    <div class="typing">
                        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="user-input" placeholder="Ask Julian about a science topic..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>

        </div>

    </div>

    <script>
        // Local "AI" Knowledge Base (Keyword matching engine)
        const knowledgeBase = [
            {
                keywords: ["mv", "manipulated", "independent", "variable", "cv", "rv"],
                response: "In an experiment, the <strong>Manipulated Variable (MV)</strong> is the ONE thing you change. The <strong>Responding Variable (RV)</strong> is what you measure (the data). The <strong>Controlled Variables (CV)</strong> are kept exactly the same to ensure a fair test."
            },
            {
                keywords: ["newton", "force", "laws", "inertia"],
                response: "Newton's laws are the foundation of 8th-grade physics! <br><br>1st: Objects keep doing what they are doing (Inertia).<br>2nd: Force equals mass times acceleration.<br>3rd: Every action has an equal and opposite reaction.<span class='formula'>F = m × a</span>"
            },
            {
                keywords: ["acceleration", "velocity", "speed"],
                response: "<strong>Speed</strong> is just how fast you are going. <strong>Velocity</strong> is speed PLUS a specific direction (like 15 mph North). <strong>Acceleration</strong> is any change in velocity (speeding up, slowing down, or turning)."
            },
            {
                keywords: ["momentum", "crash", "collision"],
                response: "Momentum is a measure of how hard it is to stop a moving object. It depends entirely on mass and velocity.<span class='formula'>p = m × v</span>In a collision, total momentum is always conserved!"
            },
            {
                keywords: ["cell", "mitochondria", "nucleus", "chloroplast"],
                response: "Let's talk biology! The <strong>Nucleus</strong> is the brain holding the DNA. The <strong>Mitochondria</strong> is the powerhouse making ATP energy. Only plant cells have <strong>Chloroplasts</strong> (for photosynthesis) and a rigid <strong>Cell Wall</strong>."
            },
            {
                keywords: ["genetics", "punnett", "dna", "allele", "dominant"],
                response: "Genetics! You inherit traits via alleles. A <strong>Dominant</strong> allele (A) overpowers a <strong>Recessive</strong> allele (a). Your Genotype is your letter code (Aa), and your Phenotype is what you physically look like."
            },
            {
                keywords: ["ecosystem", "food web", "producer", "consumer", "10% rule"],
                response: "In an ecosystem, energy flows from Producers (plants) to Consumers (animals). According to the <strong>10% Rule</strong>, only 10% of energy moves up to the next level—the other 90% is used for living or lost as heat."
            },
            {
                keywords: ["hello", "hi", "hey", "sup", "yo"],
                response: "Hey Waylon! What science topic are we conquering today?"
            }
        ];

        const fallbackResponse = "I'm still learning that one, Waylon! Try asking me about variables, Newton's laws, velocity, cells, or genetics.";

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }

        function sendMessage() {
            const inputEl = document.getElementById('user-input');
            const text = inputEl.value.trim();
            if (!text) return;

            // 1. Append User Message
            appendMessage(text, 'user');
            inputEl.value = '';

            // 2. Show Typing Indicator
            const history = document.getElementById('chat-history');
            const indicator = document.getElementById('typing-indicator');
            history.appendChild(indicator); // move to bottom
            indicator.style.display = 'flex';
            indicator.querySelector('.typing').style.display = 'block';
            history.scrollTop = history.scrollHeight;

            // 3. Process Response with slight delay
            setTimeout(() => {
                indicator.style.display = 'none';
                const reply = generateAIResponse(text);
                appendMessage(reply, 'ai');
            }, 800 + Math.random() * 600); // 0.8s to 1.4s delay for realism
        }

        function appendMessage(text, sender) {
            const history = document.getElementById('chat-history');
            const indicator = document.getElementById('typing-indicator');
            
            const row = document.createElement('div');
            row.className = `msg-row ${sender}`;
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = text; // allow HTML for formulas/bold
            
            row.appendChild(bubble);
            
            // Insert before typing indicator
            history.insertBefore(row, indicator);
            history.scrollTop = history.scrollHeight;
        }

        function generateAIResponse(input) {
            const lowerInput = input.toLowerCase();
            
            // Score matches
            let bestMatch = null;
            let highestScore = 0;

            for (const item of knowledgeBase) {
                let score = 0;
                for (const kw of item.keywords) {
                    if (lowerInput.includes(kw)) {
                        score++;
                    }
                }
                if (score > highestScore) {
                    highestScore = score;
                    bestMatch = item.response;
                }
            }

            return highestScore > 0 ? bestMatch : fallbackResponse;
        }
    </script>
</body>
</html>
